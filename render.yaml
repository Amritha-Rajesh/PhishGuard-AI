services:
  # Single Render Web Service hosting both Flask backend and React frontend
  - type: web
    name: phishguard-ai
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
